name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: macOS 15 arm64
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Record toolchain
        shell: zsh {0}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          sw_vers
          swift --version
          xcode-select -p

      - name: Validate source and resources
        shell: zsh {0}
        run: ./scripts/validate_project.sh

      # Catch release-only compiler failures before the longer UI test batches.
      - name: Build and verify app archive
        shell: zsh {0}
        run: ./scripts/build_app.sh

      - name: Run isolated test batches
        shell: zsh {0}
        run: ./scripts/run_test_batches.sh

      - name: Install independent PDF validators
        shell: zsh {0}
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          brew install qpdf poppler
          python3 -m venv work/pdf-oracle-venv
          work/pdf-oracle-venv/bin/python -m pip install 'pypdf==6.10.0' 'Pillow==12.3.0'

      - name: Validate app-generated PDFs with independent engines
        shell: zsh {0}
        run: |
          set -euo pipefail
          work/pdf-oracle-venv/bin/python -m unittest discover -s Tests/ExternalValidation
          EMBER_EXTERNAL_FIXTURE_DIRECTORY="$PWD/work/pdf-oracle-fixtures" \
            swift test --disable-sandbox --filter PDFExternalValidationFixtureTests
          work/pdf-oracle-venv/bin/python scripts/verify_pdf_outputs.py \
            --manifest work/pdf-oracle-fixtures/manifest.json \
            --output-directory work/pdf-oracle-results

  pdfkit-integration-macos-26:
    name: PDFKit integration on macOS 26 arm64
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # macOS 15 PDFKit crashes while tearing down the two-up and pointer-zoom
      # fixtures, so those assertions are skipped in the main job. Run their
      # complete class on the next supported PDFKit runtime instead of allowing
      # a permanently green-but-unexercised integration path.
      - name: Run PDFKit viewport integration tests
        shell: zsh {0}
        run: swift test --disable-sandbox --filter PDFViewportScrollInteractionTests
